<!DOCTYPE html>
<html lang="ja">
<head>

<!-- 決めた場所以外からはプログラム・画像などを読み込まない・外へ送らない（CSP）。

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<header id="top">

  <div class="logo" id="logo">🎓 算数・数学チャレンジ</div>

  </div>
  <div class="xpbar" aria-hidden="true"><div class="xpfill" id="hdXp"></div></div>
</header>

<main id="main" tabindex="-1"></main>

<nav id="nav">

  <button type="button" data-act="nav" data-s="rec"><span>🏆</span><span>きろく</span></button>
  <button type="button" data-act="nav" data-s="set"><span>⚙️</span><span>せってい</span></button>
  <button type="button" data-act="hyo"><span>🧮</span><span>表電卓</span></button>
</nav>

<div id="modal" class="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><div id="mbody"></div></div></div>
<div id="notice" class="notice-bar" role="status"></div>
<div id="fx" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
